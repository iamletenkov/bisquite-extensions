name: vino-vnc
version: 1.0.0
family: deb
# Только apt-пакеты (vino, libglib2.0-bin, dbus) — ничего не качается по
# ссылке, зависящей от архитектуры. Замер по архиву Ubuntu 2026-09-03:
# исходник `vino` публикуется от precise до questing, то есть обе цели
# закрыты. Расширение не Jetson-специфично.
arch: [amd64, arm64]
# build     — install.sh ставит vino и кладёт параметры в EnvironmentFile;
# firstboot — configure.sh применяет gsettings и кладёт автозапуск.
#
# Граница проходит по природе задачи, а не по удобству: gsettings пишет
# в dconf КОНКРЕТНОГО пользователя, автозапуск — в его домашний каталог,
# а имя пользователя создаёт cloud-init уже на устройстве. Тот же довод,
# по которому автологин у xfce4 и gnome настраивается на первой загрузке.
phase: [build, firstboot]
provides: [remote-desktop]
# x11-server      — vino обслуживает X11 и под Wayland бесполезен (README);
# display-manager — сервер живёт внутри пользовательской сессии, а открывает
#                   её дисплей-менеджер; на безголовой плате — автологином.
requires: [x11-server, display-manager]
# Конфликт с x11vnc НЕ объявлен, и это решение, а не недосмотр.
#
# Мешают друг другу не расширения, а их умолчания: оба берут RFB-порт 5900,
# и второй сервер просто не займёт его. Разводятся они параметром
# (`VINO_PORT`, `X11VNC_PORT`), то есть препятствие снимается без правки
# кода — а объявленный конфликт этого различия не выражает. Вдобавок
# bisquite поле `conflicts` только печатает: запрета из него не следует,
# следует лишь утверждение. Утверждать «эти двое несовместимы» было бы
# неправдой, а симметричная запись потребовала бы правки чужого манифеста
# ради неё же.
#
# Что действительно стоит знать — в README: два VNC-сервера на одном
# дисплее уживаются, если развести порты, и не уживаются иначе.
conflicts: []
