name: firewall
version: 1.1.0
layout: 2
family: deb
# 1.1.0: install.sh проверяет nf_tables и nft_ct для ядра ОБРАЗА и отказывает
# без них: штатное ядро L4T r36.4.3 собрано без CONFIG_NFT_CT, и правила
# с `ct state` на Jetson не загрузились бы — машина осталась бы открытой.
# Остальное — apt-пакет nftables и скрипты: архитектура не участвует.
# Проверено в контейнерах ubuntu:24.04 и debian:12 (amd64); arm64 —
# ubuntu:22.04 с раскладкой ядра L4T r36.4.3 (отказ по nft_ct).
arch: [amd64, arm64]
# build     — install.sh ставит nftables, правила по умолчанию в
#             /etc/bisquite/firewall/rules.d/ и включает bisquite-firewall.service;
# firstboot — configure.sh (ExecStart службы) собирает и применяет правила
#             на КАЖДОЙ загрузке и по `systemctl restart bisquite-firewall`.
phase: [build, firstboot]
# host-firewall — своя таблица `inet bisquite` с цепочкой input (policy drop).
# Docker не задевается: его цепочки iptables-nft живут в других таблицах,
# проброс портов идёт через forward, а не input.
provides: [host-firewall]
requires: []
conflicts: []
