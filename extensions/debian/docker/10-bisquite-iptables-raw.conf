# Положено расширением docker. Разбор — в /usr/local/libexec/bisquite-docker-iptables-raw-check.
[Service]
ExecStartPre=/usr/local/libexec/bisquite-docker-iptables-raw-check
# Файл пишет ExecStartPre выше. systemd читает EnvironmentFile перед
# запуском каждой команды, после завершения предыдущей стадии, — поэтому
# ExecStart видит уже свежий ответ. «-» — файла может не быть вовсе
# (например, если ExecStartPre убран руками), и это не повод не стартовать.
EnvironmentFile=-/run/bisquite-docker/iptables-raw.env
