# Bisquite: заставить NoCloud читать раздел с меткой cidata.
# Файл назван zz-*, а не 99-*: cloud-init сортирует cloud.cfg.d в обратном
# порядке и берёт первый (util.read_conf_d), поэтому имя должно быть
# лексикографически старше любого штатного — 'z' > любой цифры.
datasource_list: [ NoCloud, None ]
datasource:
  NoCloud:
    fs_label: cidata
    seedfrom: ""
