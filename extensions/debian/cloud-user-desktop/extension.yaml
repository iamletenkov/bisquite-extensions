name: cloud-user-desktop
version: 4.1.0
layout: 2
# 4.1.0: ручки — домен desktop библиотеки bisquite-conf (схема lib/knobs/desktop);
#        `bisquite-conf set desktop …` и `bisquite-desktop set` — одна проверка.
# 3.0.0: файл ручек переехал в /etc/bisquite/desktop/config (был
#        /etc/default/bisquite-desktop; прежний не читается, установка удаляет).
family: deb
arch: [amd64, arm64]
# build     — убирает вендорскую учётку (CLOUD_USER_DESKTOP_REMOVE) и ставит
#             bisquite-desktop — для вендорских рабочих столов, где нет
#             расширения gnome/xfce4/lxde;
# firstboot — bisquite-desktop.service до менеджера входа: группы и автологин
#             на пользователя cloud-init. 2.0.0: автологин по умолчанию ВЫКЛЮЧЕН.
phase: [build, firstboot]
provides: [cloud-user-desktop]
requires: []
conflicts: []
