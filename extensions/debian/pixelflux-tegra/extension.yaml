name: pixelflux-tegra
version: 2.0.0
layout: 2
family: deb
# Только arm64: бэкенд кодирует через вендорскую libnvv4l2.so, которая есть
# только в L4T. install.sh вдобавок отказывает на образе без
# /etc/nv_tegra_release.
arch: [arm64]
# build     — install.sh подкладывает системную libxcb (и шим gbm на focal)
#             в юнит selkies@ drop-in'ом: сессия запускается мимо AppRun, где
#             апстрим починил это сам (selkies#396). Колесо больше не подменяет:
#             Selkies 2.0.0rc1 несёт pixelflux 2.1.0rc1 с бэкендом Tegra.
# firstboot — configure.sh проверяет на живом железе, что бэкенд виден
#             (в appliance сборки устройств кодера нет).
phase: [build, firstboot]
# Возможности не объявляет: рабочий стол даёт selkies, а это его ускоритель.
# hw-video-codec тоже не наше — им владеет l4t-gstreamer, и два владельца
# одной возможности сделали бы её бессмысленной.
provides: []
# Ставится ПОСЛЕ selkies: подменяет модуль внутри поставленного им AppImage.
# Порядок строк в VMFILE bisquite не сортирует, поэтому реальная преграда —
# проверка /opt/selkies/current в начале install.sh.
requires: [web-remote-desktop]
# Оба подменяют pixelflux внутри одного AppImage: поставленный вторым
# затирает первый, и какой бэкенд окажется в сессии, зависело бы от порядка
# строк в VMFILE. Объявление симметрично тому, что стоит в pixelflux-v4l2m2m.
conflicts: [pixelflux-v4l2m2m]
