name: gnome
version: 4.0.0
layout: 2
# 3.0.0: файл ручек переехал в /etc/bisquite/desktop/config (был
#        /etc/default/bisquite-desktop; прежний не читается, установка удаляет).
family: deb
# Ставится только apt-пакетами, ничего не качает по фиксированной ссылке.
arch: [amd64, arm64]
# build     — install.sh ставит task-gnome-desktop/gdm3, выключает Wayland
#             и ставит bisquite-desktop (ручки DESKTOP_*);
# firstboot — bisquite-desktop.service на устройстве, на КАЖДОЙ загрузке до
#             gdm: группы пользователя cloud-init, автологин, блокировка и
#             затемнение по ручкам. 2.0.0: всё это по умолчанию ВЫКЛЮЧЕНО.
phase: [build, firstboot]
# xorg xinput          -> x11-server     (install.sh:21)
# gdm3 + set-default graphical.target -> display-manager (install.sh:38-39)
# task-gnome-desktop   -> desktop-session
provides: [x11-server, display-manager, desktop-session]
requires: []
# Три десктопа взаимоисключающи: каждый ставит свой display manager и
# делает его системным `display-manager.service`.
conflicts: [xfce4, lxde]
