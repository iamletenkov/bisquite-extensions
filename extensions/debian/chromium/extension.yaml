name: chromium
version: 1.0.0
family: deb
# Проверено на arm64 (Jetson, jammy) 2026-09-12. Amd64 не тестировался
# отдельно, но механизм пакета одинаков на любом jammy — Ubuntu Desktop
# сам ставит браузер тем же путём.
arch: [amd64, arm64]
# build     — install.sh ставит транзитный пакет chromium-browser (тянет
#             snapd); фактическая установка snap-пакета — постинст deb,
#             и внутри virt-customize он может не довестись до конца
#             (нет ни работающего systemd, ни гарантии сети на этом шаге);
# firstboot — configure-chromium.service доводит дело: ждёт snapd, ждёт
#             seed, ставит snap chromium явно. Если постинст уже справился
#             на сборке — это быстрый no-op, не двойная работа.
phase: [build, firstboot]
provides: [browser]
requires: []
conflicts: []
