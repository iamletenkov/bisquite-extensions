name: nvidia-jetpack
version: 1.0.0
family: deb
# Станция прошивки — это обычный ПК с USB-портом, а не сама плата. Весь
# инструментарий L4T (flash.sh, tools/kernel_flash/*.sh, tegraflash.py)
# запускается на x86_64-хосте и уже сам ходит в arm64-rootfs через
# qemu-user-static. Расширение jetson-stats — про обратное, оно ставится
# на плату и объявляет arm64; путать их не надо.
arch: [amd64]
# Только build: расширение ставит пакеты, включает nfs-server, кладёт
# udev-правило и раскладывает скрипты в /opt/nvidia-jetpack. Ничего из этого
# не зависит от конкретной машины, на которой образ окажется, — значит
# донастраивать на первой загрузке нечего, и configure.sh здесь нет.
# Пустой configure.sh был бы обещанием, которого никто не держит.
phase: [build]
# Способность называет роль машины целиком, а не отдельную утилиту: смысл
# расширения — «этот образ умеет прошивать Jetson», и ссылаться на него будут
# именно так.
provides: [jetson-flash-station]
# Скрипты станции тянут BSP сами и работают с системными пакетами, которые
# ставит этот же install.sh. Ни рабочего стола, ни контейнеров, ни VNC им
# не требуется — образ станции их включает по другим причинам.
requires: []
# С расширением nvidia (проприетарный GPU-драйвер для десктопа) не
# конфликтует: там речь про видеокарту хоста, здесь — про USB-заливку платы,
# общих файлов нет. С l4t-kernel-kvm и l4t-board-fdt тоже не пересекается —
# те про Nano и tegra210.
conflicts: []
