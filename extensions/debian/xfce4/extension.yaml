name: xfce4
version: 3.0.0
# 3.0.0: файл ручек переехал в /etc/bisquite/desktop/config (был
#        /etc/default/bisquite-desktop; прежний не читается, установка удаляет).
family: deb
arch: [amd64, arm64]
# build     — install.sh ставит Xfce4 и lightdm, пишет lightdm.conf и ставит
#             bisquite-desktop (ручки DESKTOP_*);
# firstboot — bisquite-desktop.service на устройстве, на КАЖДОЙ загрузке до
#             lightdm. 2.0.0: автологин, отключение блокировки и затемнения
#             по умолчанию ВЫКЛЮЧЕНЫ.
phase: [build, firstboot]
# xorg xinput                          -> x11-server     (install.sh:21)
# lightdm + set-default graphical.target -> display-manager (install.sh:38-39)
# xfce4 xfce4-goodies                  -> desktop-session
provides: [x11-server, display-manager, desktop-session]
requires: []
conflicts: [gnome, lxde]
