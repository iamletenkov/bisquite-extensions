name: nvidia
version: 2.0.0
layout: 2
family: deb
# Ubuntu: модули Canonical и PPA graphics-drivers публикуются для amd64;
# Debian: репозиторий CUDA NVIDIA — каталог x86_64 (install.sh). arm64-серверы
# (SBSA) не проверялись, Jetson обслуживает nvidia-jetpack.
arch: [amd64]
# Только build: configure.sh у расширения нет, модуль собирается под ядро
# образа при сборке; на машине нужна лишь загрузка.
phase: build
provides: [gpu-driver-nvidia]
requires: []
conflicts: []
