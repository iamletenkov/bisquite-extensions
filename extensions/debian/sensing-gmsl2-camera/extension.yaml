name: sensing-gmsl2-camera
version: 1.0.0
family: deb
# Только Jetson AGX Orin с адаптером SG8A-AGON-G2Y-A1 — драйверы и DTB
# специфичны железу, install.sh отказывает на любом другом /etc/nv_tegra_release
# (или его отсутствии) до сети и до копирования файлов.
arch: [arm64]
# Только build: замена ядра, .ko и DTB-оверлея — не персональные шаги,
# они не зависят от того, кто станет пользователем на устройстве.
# quick_bring_up.sh (выбор модели камеры и порта) — не автоматизирован,
# см. README: номер порта определяется только по факту на конкретной
# сборке адаптера, автоматизация дала бы ложное чувство готовности.
phase: build
provides: [gmsl2-camera]
requires: []
# Расширение подменяет /boot/Image целиком — тем же файлом, что несёт.
# Ставить его вместе с чем-то ещё, что тоже претендует на ядро платы
# (гипотетический l4t-kernel-kvm для t210, но это другой SoC), не имеет
# смысла, и конфликта заявлять не с чем.
conflicts: []
