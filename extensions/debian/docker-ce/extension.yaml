name: docker-ce
version: 1.0.0
family: deb
# install.sh подставляет ARCH в поле Architectures репозитория Docker;
# debian/trixie/arm64 у Docker есть, см. README расширения.
arch: [amd64, arm64]
# build     — install.sh прописывает репозиторий Docker и ставит пять пакетов;
# firstboot — configure-docker-ce.service добавляет пользователя cloud-init
#             в группу docker.
phase: [build, firstboot]
provides: [container-runtime]
requires: []
conflicts: [docker]
