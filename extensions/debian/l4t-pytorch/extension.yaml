name: l4t-pytorch
version: 1.2.0
layout: 2
# 1.2.0: ветка R32 (Jetson Nano) — ничего не ставит, сверяет импорт torch с CUDA
#        и закрепляет OPENBLAS_CORETYPE=ARMV8 (lib/l4t); поведение на r36 прежнее.
family: deb
# Только arm64 и только L4T: колесо torch — сборка NVIDIA под JetPack,
# с PyPI-колесом aarch64 оно несовместимо (PyPI-сборка без CUDA).
arch: [arm64]
phase: build
provides: [pytorch]
# cuda — не порядок ради порядка. torchvision собирается из исходников
# с FORCE_CUDA=1, и ему нужен nvcc из cuda-toolkit; сам torch грузит
# libcublas, libcufft, libcusparse и прочие библиотеки тулкита.
# На R32 (Nano) torch уже в образе вместе с CUDA 10.2, и cuda-toolkit там не
# ставится: требование — объявление для r36, резолвер из него запрета не делает.
requires: [cuda]
conflicts: []
