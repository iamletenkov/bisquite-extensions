name: pixelflux-v4l2m2m
version: 1.0.0
layout: 2
# 1.0.0: Selkies 2.0.0rc1 несёт pixelflux 2.1.0rc1 с бэкендом v4l2m2m, и лестница
#        сама падает с VA-API на M2M. Колесо и rc0-compat убраны; расширение
#        свелось к проверке — на сборке, что база несёт бэкенд, и на первой
#        загрузке (verify), что сессия идёт на V4L2M2M, а не в софт.
family: deb
# Бэкенд generic и по архитектуре не гейтится, но платы с M2M в нашем парке —
# Raspberry Pi 3/4 и CM4, то есть arm64. Проверка «именно M2M» на amd64
# смысла не имеет.
arch: [arm64]
# build     — убедиться, что базовый pixelflux несёт бэкенд v4l2m2m, и включить
#             службу verify;
# firstboot — проверить на живом устройстве, что сессия поднялась НА УЗЛЕ,
#             а не свалилась в софт.
phase: [build, firstboot]
provides: [hardware-video-encoding]
# Проверяет модуль внутри AppImage, который ставит `selkies`, и требует, чтобы
# selkies шёл раньше.
requires: [web-remote-desktop]
conflicts: [pixelflux-tegra]
