name: x11vnc
version: 1.0.0
family: deb
arch: [amd64, arm64]
# build     — install.sh ставит x11vnc и кладёт x11vnc@.service;
# firstboot — configure.sh включает x11vnc@<пользователь>.service, а имя
#             пользователя приходит из cloud-init уже на устройстве.
phase: [build, firstboot]
provides: [remote-desktop]
# x11-server      — сервер прицепляется к DISPLAY=:0 (x11vnc@.service:9,12);
# display-manager — `Requires=display-manager.service` там же (строка 4),
#                   плюс XAUTHORITY берётся из каталога дисплей-менеджера.
# Ровно то отношение, которое сегодня держится только порядком слоёв в
# четырёх VMFILE: desktop, затем x11vnc.
requires: [x11-server, display-manager]
conflicts: []
