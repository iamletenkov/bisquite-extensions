name: nocloud-cidata
version: 1.0.0
family: deb
# Копирование файла архитектуры не касается, но фаза `build` означает
# «выполняется код в госте», а libguestfs требует совпадения хоста и гостя.
# Объявлены обе цели: расширение работает на любой, где архитектуры совпали.
arch: [amd64, arm64]
# Только `build`: на первой загрузке делать нечего — cloud-init читает
# конфигурацию до того, как что-либо могло бы её поправить.
phase: [build]
provides: [nocloud-cidata-seed]
requires: []
conflicts: []
