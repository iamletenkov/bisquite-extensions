name: kiosk
version: 1.0.0
family: deb
arch: [amd64, arm64]
# build     — install.sh ставит chromium и кладёт kiosk-chromium@.service;
# firstboot — configure.sh поднимает kiosk-chromium@<пользователь> под
#             пользователем из cloud-init.
phase: [build, firstboot]
provides: [kiosk-browser]
# install.sh НЕ ставит xorg — только клиентские утилиты X (x11-xserver-utils,
# x11-utils, xauth) и dbus-x11. X-сервер и автологин обязан дать кто-то другой:
#   kiosk-chromium@.service   — DISPLAY=:0, а authority ищет run-kiosk.sh
#   configure-kiosk.service:3 — After=graphical.target ... display-manager.service
#
# Требование родовое, и это верно: путь к X authority больше не зашит в юните,
# а ищется в рантайме — под LightDM и под GDM он разный. Различать в манифесте
# «какой именно дисплей-менеджер» значило бы зафиксировать ось, которая ответа
# не определяет.
requires: [x11-server, display-manager]
# Обе реализации киоска забирают экран себе, автостартом на graphical.target.
conflicts: [chromium-kiosk]
